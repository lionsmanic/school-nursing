<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health Office">
<title>Health Office — Student Check-in 校護站</title>
<style>
:root{
  --ink:#12303C;
  --ink-2:#4A6975;
  --paper:#EEF3F1;
  --surface:#FFFFFF;
  --line:#D3E0DC;
  --teal:#0E7C7B;
  --teal-dim:#DCEDEC;
  --amber:#B57314;
  --amber-dim:#FBF0DB;
  --alert:#B33327;
  --alert-dim:#FBE6E3;
  --shadow:0 1px 0 rgba(18,48,60,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",'Helvetica Neue',sans-serif;
  font-size:18px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.who{flex:1;display:flex;gap:8px;min-width:0}
.who input{
  flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;
  border:1px solid var(--line);border-radius:8px;background:#FBFDFC;color:var(--ink);
}
.who input::placeholder{color:#9DB2B0}
.barbtn{
  border:1px solid var(--line);background:var(--surface);
  padding:9px 13px;border-radius:8px;font-size:15px;font-weight:600;white-space:nowrap;
}
.barbtn.alarm{background:var(--alert);border-color:var(--alert);color:#fff}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 0}

/* ---------- headings ---------- */
.ask{margin:10px 0 4px;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.ask-zh{margin:0 0 18px;font-size:19px;color:var(--ink-2)}
.hint{font-size:15px;color:var(--ink-2);margin:0 0 14px}

/* ---------- trail ---------- */
.trail{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;min-height:0}
.chip{
  background:var(--teal-dim);border:1px solid #BFDCDA;color:#0B5D5C;
  padding:6px 11px;border-radius:999px;font-size:14px;font-weight:600;
}
.chip b{font-weight:600;color:#0B5D5C;opacity:.65;margin-left:6px;font-size:13px}

/* ---------- big choice grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pick{
  display:flex;align-items:center;gap:14px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:18px 16px;min-height:84px;box-shadow:var(--shadow);
  transition:border-color .12s,background .12s;
}
.pick:active{background:var(--teal-dim);border-color:var(--teal)}
.pick.on{border-color:var(--teal);border-width:2px;background:var(--teal-dim);padding:17px 15px}
.pick .ico{font-size:32px;line-height:1;flex:none}
.pick .tx{min-width:0}
.pick .en{display:block;font-size:21px;font-weight:600;letter-spacing:-.01em}
.pick .zh{display:block;font-size:15px;color:var(--ink-2);margin-top:2px}
.pick .tick{margin-left:auto;font-size:22px;color:var(--teal);opacity:0}
.pick.on .tick{opacity:1}

/* ---------- footer nav ---------- */
.nav{display:flex;gap:12px;margin:22px 0 10px;align-items:center;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--surface);
  padding:15px 22px;border-radius:10px;font-size:18px;font-weight:600;
}
.btn.go{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.go:disabled{opacity:.35}
.spacer{flex:1}

/* ---------- result ---------- */
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.sum{font-size:22px;line-height:1.55;font-weight:600}
.sum .q{color:var(--ink-2);font-weight:500;font-size:16px;display:block;margin-top:8px}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin-bottom:11px;font-size:17.5px;line-height:1.55}
ol.steps li:last-child{margin-bottom:0}
.flagbox{background:var(--alert-dim);border:1px solid #EEBFB9;border-left:5px solid var(--alert);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.flagbox h4{margin:0 0 8px;color:var(--alert);font-size:17px}
.flagbox ul{margin:0;padding-left:20px}
.flagbox li{margin-bottom:6px;font-size:17px}
.dispo{background:var(--amber-dim);border:1px solid #EBD6A8;border-radius:10px;padding:13px 15px;font-size:17px;margin-top:14px}
.dispo b{color:var(--amber)}
.say{background:#F7FBFA;border:1px dashed #B9D5D2;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.say .e{font-size:23px;font-weight:600;line-height:1.35}
.say .c{font-size:15px;color:var(--ink-2);margin-top:5px}
.note-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.note-grid label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.note-grid input,.card textarea{
  width:100%;font:inherit;font-size:17px;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:#FBFDFC;color:var(--ink);
}
.card textarea{min-height:76px;resize:vertical}
.timer{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.timer .clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px}
.small{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-size:15px;font-weight:600}

/* ---------- log ---------- */
table.log{width:100%;border-collapse:collapse;font-size:15px}
table.log th{text-align:left;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);padding:8px 8px}
table.log td{border-bottom:1px solid #E8EFED;padding:10px 8px;vertical-align:top}
table.log tr:last-child td{border-bottom:none}
.empty{padding:40px 10px;text-align:center;color:var(--ink-2)}

/* ---------- emergency ---------- */
.sos{background:var(--alert-dim);border:2px solid var(--alert);border-radius:12px;padding:20px}
.sos h2{margin:0 0 6px;color:var(--alert);font-size:26px}
.sos ol li{font-size:18px;margin-bottom:10px}

@media print{
  .bar,.nav,.noprint{display:none!important}
  body{background:#fff;font-size:12pt}
  .card{border:1px solid #999;box-shadow:none;break-inside:avoid}
  .cols{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">Health Office<small>保健室 · 學生自助選擇板</small></div>
  <div class="who noprint">
    <input id="sName" placeholder="Student name 姓名" autocomplete="off">
    <input id="sGrade" placeholder="Grade / Class 年級班級" autocomplete="off" style="max-width:170px">
  </div>
  <button class="barbtn noprint" style="background:#FBF0DB;border-color:#E7D2A4;color:#8A5709" onclick="go('meds')">💉 急救用藥</button>
  <button class="barbtn noprint" onclick="go('phrases')">英文速查</button>
  <button class="barbtn noprint" onclick="go('log')">紀錄</button>
  <button class="barbtn alarm noprint" onclick="go('sos')">EMERGENCY</button>
</div>

<div class="wrap" id="app"></div>

<script>
/* =========================================================
   資料結構
   cat: { id, en, zh, ico, q[], plan[], dispo, say[] }
   q  : { en, zh, multi, o[] }
   o  : { en, zh, flag?, act?[] }   flag → 紅旗；act → 追加處置
   ========================================================= */

const DUR = {en:'How long has it been?', zh:'從什麼時候開始？', multi:false, o:[
  {en:'Just now',       zh:'剛剛才開始'},
  {en:'Earlier today',  zh:'今天稍早'},
  {en:'Since yesterday',zh:'昨天開始'},
  {en:'A few days',     zh:'好幾天了'}
]};
const PAIN = {en:'How bad is it?', zh:'有多不舒服？', multi:false, o:[
  {en:'A little (1–3)',  zh:'輕微 1–3 分'},
  {en:'Medium (4–6)',    zh:'中等 4–6 分'},
  {en:'A lot (7–10)',    zh:'嚴重 7–10 分', flag:'學生自述疼痛 7 分以上 — 需實際評估並考慮通知家長'}
]};

const DATA = [
{ id:'head', en:'Headache / Dizzy', zh:'頭痛、頭暈', ico:'🤕',
  q:[
    {en:'What do you feel?', zh:'是哪一種？', multi:false, o:[
      {en:'Headache', zh:'頭痛'},
      {en:'Dizzy, light-headed', zh:'頭暈、站不穩'},
      {en:'Both', zh:'兩種都有'}
    ]},
    DUR, PAIN,
    {en:'Anything else? (tap all)', zh:'還有什麼？可複選', multi:true, o:[
      {en:'I hit my head', zh:'我有撞到頭', flag:'頭部外傷 — 啟動 head injury protocol，務必通知家長',
        act:['執行 neuro check：意識、瞳孔、平衡、記憶，每 15 分鐘一次共 1 小時','填寫 head injury report，通知家長並提供 head injury fact sheet（返家後 24 小時觀察）']},
      {en:'I feel like throwing up', zh:'覺得想吐', flag:'頭痛合併嘔吐 — 需排除頭部外傷與感染'},
      {en:'I feel hot / feverish', zh:'覺得發燒', act:['量耳溫或額溫並記錄']},
      {en:'My vision is blurry', zh:'視線模糊', flag:'視力改變 — 需通知家長，不宜自行返家'},
      {en:'No breakfast today', zh:'今天沒吃早餐', act:['低血糖可能：給予餅乾或果汁，15 分鐘後重新評估']},
      {en:'I didn\'t sleep well', zh:'昨晚沒睡好'},
      {en:'Nothing else', zh:'沒有了'}
    ]}
  ],
  plan:['測量體溫、脈搏、血壓，並記錄','詢問今日進食、飲水、睡眠與用眼情形','安置於安靜微暗處平躺或坐臥休息 15–20 分鐘，給予溫開水','15–20 分鐘後重新評估；改善即可返回教室，並註記回教室時間'],
  dispo:'多數可休息後返班。若合併撞到頭、嘔吐、視力改變、發燒或疼痛未緩解 → 通知家長帶回並就醫。',
  say:[{en:'Sit here and rest for 15 minutes. I will check on you.', zh:'先坐在這裡休息 15 分鐘，我會再來看你。'},
       {en:'Please drink some water.', zh:'喝一點水。'},
       {en:'Did you hit your head today?', zh:'今天有撞到頭嗎？'}]
},

{ id:'tummy', en:'Stomach ache / Throwing up', zh:'肚子痛、想吐', ico:'🤢',
  q:[
    {en:'What is happening?', zh:'是哪一種？', multi:true, o:[
      {en:'Stomach hurts', zh:'肚子痛'},
      {en:'I feel like throwing up', zh:'想吐、噁心'},
      {en:'I threw up', zh:'已經吐了', flag:'已嘔吐 — 依校規多需通知家長帶回，並符合返校規定'},
      {en:'Diarrhea', zh:'腹瀉', flag:'腹瀉 — 注意腸胃炎群聚，需通報'},
      {en:'I need the bathroom', zh:'想上廁所'}
    ]},
    {en:'Where does it hurt?', zh:'痛在哪裡？', multi:false, o:[
      {en:'Upper belly', zh:'上腹（胃的位置）'},
      {en:'Around the belly button', zh:'肚臍周圍'},
      {en:'Lower right side', zh:'右下腹', flag:'右下腹痛 — 需排除闌尾炎，勿給止痛藥或食物，通知家長就醫',
        act:['評估反彈痛、走路或跳躍是否加劇、有無發燒','禁食禁水，立即通知家長送醫']},
      {en:'Lower belly', zh:'下腹'},
      {en:'All over', zh:'整個肚子'}
    ]},
    DUR, PAIN,
    {en:'Anything else?', zh:'還有什麼？可複選', multi:true, o:[
      {en:'I feel hot / feverish', zh:'覺得發燒', act:['量體溫並記錄']},
      {en:'I ate something unusual', zh:'吃了不一樣的東西'},
      {en:'It is my period', zh:'月經來了'},
      {en:'I am worried about a test', zh:'考試或事情讓我緊張', act:['考慮情境性腹痛：休息、腹式呼吸，必要時轉介 school counselor']},
      {en:'Nothing else', zh:'沒有了'}
    ]}
  ],
  plan:['視診腹部、觸診四象限，評估壓痛與反彈痛，記錄有無發燒','先禁食固體，可小口溫開水；未排除急腹症前不給止痛藥','側臥休息 15–20 分鐘，鼓勵先如廁','15–20 分鐘後重新評估疼痛分數並記錄'],
  dispo:'單純腹痛且緩解 → 返班。嘔吐、腹瀉、發燒、右下腹痛或疼痛加劇 → 通知家長帶回／就醫。',
  say:[{en:'Point with one finger to where it hurts the most.', zh:'用一根手指指出最痛的地方。'},
       {en:'Do not eat anything yet. Small sips of water only.', zh:'先不要吃東西，只小口喝水。'},
       {en:'Do you need the bathroom first?', zh:'要不要先去廁所？'}]
},

{ id:'cut', en:'Cut / Scrape / Bleeding', zh:'割傷、擦傷、流血', ico:'🩹',
  q:[
    {en:'Where is it?', zh:'受傷部位？', multi:false, o:[
      {en:'Head or face', zh:'頭部或臉部', flag:'頭臉部傷口 — 出血多、易留疤，需通知家長'},
      {en:'Hand or arm', zh:'手或手臂'},
      {en:'Knee or leg', zh:'膝蓋或腿'},
      {en:'Somewhere else', zh:'其他部位'}
    ]},
    {en:'Is it still bleeding?', zh:'還在流血嗎？', multi:false, o:[
      {en:'It stopped', zh:'已經止住了'},
      {en:'A little', zh:'還有一點'},
      {en:'Still bleeding a lot', zh:'流很多', flag:'持續出血 — 直接加壓 10 分鐘不中斷；無法止血須立即送醫'}
    ]},
    {en:'How did it happen?', zh:'怎麼受傷的？', multi:false, o:[
      {en:'I fell down', zh:'跌倒'},
      {en:'Something sharp cut me', zh:'被尖銳物割到', flag:'銳器傷 — 確認破傷風疫苗史，評估是否需縫合'},
      {en:'An animal or person bit me', zh:'被動物或人咬到', flag:'咬傷 — 感染風險高，須通知家長就醫評估抗生素與疫苗'},
      {en:'During sports or PE', zh:'運動時受傷'}
    ]}
  ],
  plan:['洗手、戴手套（standard precaution）','以生理食鹽水或流動清水沖洗傷口，清除砂石異物','乾紗布直接加壓止血 5–10 分鐘，勿反覆掀開查看','止血後塗抗菌藥膏、覆蓋無菌敷料並固定','確認傷口長度與深度，拍照或圖示記錄於就診紀錄'],
  dispo:'淺層擦傷處理後返班，並告知敷料保持乾燥。傷口深、超過約 1 公分、脂肪外露、貫穿傷、咬傷或無法止血 → 通知家長就醫（縫合黃金時間約 6–8 小時）。',
  say:[{en:'I need to clean it with water first. It may sting a little.', zh:'我要先用水沖乾淨，可能會有點刺痛。'},
       {en:'Press here and do not let go.', zh:'壓住這裡，不要放開。'},
       {en:'Keep the bandage dry today.', zh:'今天保持敷料乾燥。'}]
},

{ id:'sprain', en:'Hurt my arm or leg', zh:'扭傷、撞傷、骨骼肌肉', ico:'🦵',
  q:[
    {en:'Which part?', zh:'哪個部位？', multi:false, o:[
      {en:'Ankle or foot', zh:'腳踝或腳'},
      {en:'Knee or leg', zh:'膝蓋或腿'},
      {en:'Wrist or hand', zh:'手腕或手'},
      {en:'Finger', zh:'手指'},
      {en:'Shoulder or arm', zh:'肩膀或手臂'},
      {en:'Neck or back', zh:'頸部或背部', flag:'頸／背部受傷 — 未排除脊椎損傷前不要移動學生'}
    ]},
    {en:'Can you move it?', zh:'還能動嗎？', multi:false, o:[
      {en:'Yes, it just hurts', zh:'可以動，只是會痛'},
      {en:'A little, it is hard', zh:'可以但很困難'},
      {en:'No, I cannot move it', zh:'完全不能動', flag:'無法活動或無法承重 — 疑似骨折，需固定並通知家長就醫'}
    ]},
    {en:'What does it look like?', zh:'外觀怎麼樣？', multi:true, o:[
      {en:'Swollen', zh:'腫起來'},
      {en:'Bruised', zh:'瘀青'},
      {en:'It looks bent or out of place', zh:'看起來變形或歪掉', flag:'肢體變形 — 高度疑似骨折或脫臼，原位固定，勿嘗試復位，立即送醫'},
      {en:'Numb or tingling', zh:'麻麻的、沒感覺', flag:'感覺異常 — 注意神經血管受損，立即送醫'},
      {en:'It looks normal', zh:'看起來正常'}
    ]},
    PAIN
  ],
  plan:['依 RICE 處理：休息、冰敷、加壓、抬高','冰敷每次 15 分鐘，中間隔毛巾，勿直接接觸皮膚','評估腫脹、變形、活動度、遠端脈搏與感覺','可用彈性繃帶加壓，抬高患肢高於心臟','15–20 分鐘後重新評估，記錄能否行走或抓握'],
  dispo:'輕度扭挫傷 → 冰敷後返班，通知家長回家續冰敷並觀察。變形、無法承重／抓握、麻木或劇痛 → 固定後立即通知家長就醫排除骨折。',
  say:[{en:'Can you stand on it?', zh:'這隻腳可以站嗎？'},
       {en:'I will put ice on it for 15 minutes.', zh:'我幫你冰敷 15 分鐘。'},
       {en:'Try to move your fingers/toes for me.', zh:'動一下手指／腳趾給我看。'}]
},

{ id:'fever', en:'Fever / Cold / Sore throat', zh:'發燒、感冒、喉嚨痛', ico:'🤒',
  q:[
    {en:'What do you have?', zh:'有哪些症狀？可複選', multi:true, o:[
      {en:'I feel hot / feverish', zh:'覺得發燒、發冷'},
      {en:'Sore throat', zh:'喉嚨痛'},
      {en:'Cough', zh:'咳嗽'},
      {en:'Runny or stuffy nose', zh:'流鼻水、鼻塞'},
      {en:'Body aches', zh:'全身痠痛'},
      {en:'Headache', zh:'頭痛'}
    ]},
    DUR,
    {en:'Anything else?', zh:'還有什麼？可複選', multi:true, o:[
      {en:'Hard to breathe', zh:'呼吸困難', flag:'呼吸困難 — 立即評估呼吸速率與血氧，必要時啟動 EMS'},
      {en:'Rash on my skin', zh:'身上有紅疹', flag:'發燒合併皮疹 — 需隔離並通知家長就醫排除傳染病'},
      {en:'Someone at home is sick', zh:'家裡有人生病'},
      {en:'I threw up', zh:'有嘔吐'},
      {en:'Nothing else', zh:'沒有了'}

/* =========================================================
   狀態與流程
   ========================================================= */
let S = {view:'home', cat:null, step:0, picks:[], sel:[], timer:null, tLeft:0, wt:0, med:'epi'};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function go(v){ S.view=v; draw(); window.scrollTo(0,0); }

function startCat(i){
  S.cat = DATA[i]; S.step = 0; S.picks = []; S.sel = [];
  S.view = 'q'; draw(); window.scrollTo(0,0);
}
function toggle(i){
  const q = S.cat.q[S.step];
  if(q.multi){
    const k = S.sel.indexOf(i);
    if(k>=0) S.sel.splice(k,1); else S.sel.push(i);
    draw();
  } else {
    S.sel = [i]; next();
  }
}
function next(){
  const q = S.cat.q[S.step];
  S.picks[S.step] = {q, sel:S.sel.slice()};
  S.sel = [];
  if(S.step < S.cat.q.length-1){ S.step++; S.view='q'; }
  else { S.view='result'; }
  draw(); window.scrollTo(0,0);
}
function back(){
  if(S.step > 0){ S.step--; S.sel = (S.picks[S.step]||{sel:[]}).sel.slice(); S.view='q'; }
  else { S.view='home'; S.cat=null; }
  draw(); window.scrollTo(0,0);
}

/* 彙整選擇 → 摘要、紅旗、追加處置 */
function digest(){
  const zh = [], en = [], flags = [], acts = [];
  S.picks.forEach(p=>{ if(!p) return;
    const zs = p.sel.map(i=>p.q.o[i].zh), es = p.sel.map(i=>p.q.o[i].en);
    if(zs.length) zh.push(p.q.zh.replace(/？.*$/,'') + '：' + zs.join('、'));
    if(es.length) en.push(es.join(', '));
    p.sel.forEach(i=>{
      const o = p.q.o[i];
      if(o.flag) flags.push(o.flag);
      if(o.act) o.act.forEach(a=>acts.push(a));
    });
  });
  return {zh, en, flags, acts};
}

/* ---------- 觀察計時器 ---------- */
function startTimer(min){
  stopTimer(); S.tLeft = min*60;
  const el = ()=>document.getElementById('clock');
  const tick = ()=>{
    const e = el(); if(!e){ stopTimer(); return; }
    const m = Math.floor(S.tLeft/60), s = S.tLeft%60;
    e.textContent = m+':'+String(s).padStart(2,'0');
    if(S.tLeft<=0){ e.textContent='時間到 ✓'; e.style.color='#B33327'; stopTimer(); return; }
    S.tLeft--;
  };
  tick(); S.timer = setInterval(tick,1000);
}
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }

function exportCSV(){
  const recs = getRecs();
  if(!recs.length){ alert('目前沒有紀錄可匯出。'); return; }
  const head = ['時間','姓名','年級班級','主訴','主訴(EN)','細節','細節(EN)','紅旗','體溫','脈搏','血壓','疼痛','處置備註'];
  const rows = recs.map(r=>[new Date(r.t).toLocaleString('zh-TW'),r.name,r.grade,r.cat,r.catEn,r.detail,r.detailEn,r.flags,r.temp,r.hr,r.bp,r.pain,r.note]);
  const csv = '\uFEFF' + [head,...rows].map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'health-office-log-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

    '懷疑低血糖但無法測血糖時，一律當作低血糖處理'
  ],
  dose:function(kg){
    const g = kg && kg<25 ? '0.5 mg' : (kg ? '1 mg' : '< 25 kg → 0.5 mg｜≥ 25 kg → 1 mg');
    return [
      ['口服快速糖（清醒時）','15 g：果汁 120 ml、含糖汽水 120 ml、葡萄糖片 3–4 片或葡萄糖凝膠 1 條（幼童可用 10 g）'],
      ['Glucagon 注射 IM／SC（昏迷時）', g + (kg?'（依體重）':'') + '，注射於大腿外側或上臂'],
      ['Gvoke 預充式筆','2–< 45 kg → 0.5 mg｜≥ 45 kg → 1 mg'],
      ['Baqsimi 鼻噴劑','3 mg 單側鼻孔，4 歲以上不需依體重調整，即使鼻塞仍有效']
    ];
  },
  how:[
    '<strong>15 法則：</strong>給 15 g 快速糖 → 等 15 分鐘 → 重測血糖。仍 < 70 mg/dL 就再給一次 15 g',
    '血糖回升後，若距下一餐超過 1 小時，追加含蛋白質與複合醣的點心（如起司餅乾）',
    '昏迷者：側臥擺位、保護呼吸道，給 glucagon 後<strong>立即撥 911</strong>',
    '低血糖學生<strong>絕不可單獨移動</strong>，不可讓他自己走來保健室，護理師應前往現場'
  ],
  repeat:'口服糖每 15 分鐘可重複；glucagon 若 15 分鐘未清醒可再給一劑（若有第二支）並持續 911 支援。',
  after:[
    'Glucagon 後常見嘔吐 → 保持側臥防吸入',
    '任何使用 glucagon 的事件一律送醫並通知家長',
    '記錄血糖數值、時間、給糖內容與複測結果；通報家長當日血糖紀錄'
  ],
  bad:['對意識不清的學生灌食物、果汁或塗糖在牙齦','用低糖／代糖飲料或巧克力（脂肪延緩吸收）','沒有複測血糖就讓學生回教室','讓學生自己走去保健室']
},

{ id:'anti', tab:'退燒止痛', name:'Acetaminophen ／ Ibuprofen ／ Diphenhydramine', sub:'非緊急用藥 — 必須有家長書面同意與 standing order', tone:'amber',
  when:[
    '<strong>這三種藥在美國學校都屬於「需家長書面同意＋醫囑」才能給的藥</strong>，沒有文件一律不給',
    '發燒 ≥ 100.4°F（38°C）多數學校規定是通知家長帶回，而不是給退燒藥後讓學生留校',
    'Diphenhydramine 僅用於<strong>輕微局部</strong>過敏反應，且<strong>絕不可取代 epinephrine</strong>'
  ],
  dose:function(kg){
    const A = kg? r1(Math.min(kg*15,1000)) : null;
    const I = kg? r1(Math.min(kg*10,400)) : null;
    const D = kg? r1(Math.min(kg*1,50)) : null;
    return [
      ['Acetaminophen（Tylenol）', kg? A+' mg（15 mg/kg，每 4–6 小時，單次上限 1000 mg）＝ 糖漿 160 mg/5 mL 約 '+ml(A,160,5)+' mL' : '15 mg/kg，每 4–6 小時，單次上限 1000 mg'],
      ['Ibuprofen（Advil／Motrin）', kg? I+' mg（10 mg/kg，每 6–8 小時，單次上限 400 mg）＝ 懸液 100 mg/5 mL 約 '+ml(I,100,5)+' mL｜需隨餐或餐後' : '10 mg/kg，每 6–8 小時，單次上限 400 mg；6 個月以下不用'],
      ['Diphenhydramine（Benadryl）', kg? D+' mg（1 mg/kg，每 6 小時，單次上限 50 mg）＝ 糖漿 12.5 mg/5 mL 約 '+ml(D,12.5,5)+' mL' : '1 mg/kg，每 6 小時，單次上限 50 mg'],
      ['⚠ 不可給兒童 Aspirin','病毒感染兒童使用可能引發 Reye syndrome，學校一律不給']
    ];
  },
  how:[
    '給藥前執行<strong>五對</strong>：對人、對藥、對劑量、對時間、對途徑，並核對家長同意書效期',
    '確認學生今日在家是否已服藥、服藥時間與劑量，避免重複劑量',
    '給藥後記錄於 MAR 並簽名，通知家長已給藥',
    'Ibuprofen 需飯後或隨食物；腹痛未排除急腹症前不給任何止痛藥'
  ],
  repeat:'依上述間隔；學校時段內原則上只給一劑，需第二劑代表病情未緩解，應通知家長帶回。',
  after:['給藥後 30–60 分鐘重新評估症狀與體溫','未緩解或反覆發燒 → 通知家長帶回就醫'],
  bad:['沒有家長同意書就給藥','用學校備藥給有藥物過敏史未查證的學生','給退燒藥後讓發燒學生留在教室（掩蓋症狀且持續傳染）','以 Benadryl 處理全身性過敏反應']
},

{ id:'top', tab:'外用與其他', name:'外用藥與一般備品', sub:'傷口、蟲咬、曬傷等日常處置', tone:'teal',
  when:['擦傷、割傷、蟲咬、輕微曬傷等不需全身性用藥的情況'],
  dose:function(kg){
    return [
      ['抗菌藥膏 Bacitracin／Neosporin','清潔止血後薄擦一層再覆蓋敷料；已知新黴素過敏者勿用'],
      ['1% Hydrocortisone 乳膏','蟲咬或接觸性皮膚炎，每日 1–2 次薄擦；勿用於臉部、破皮或滲液傷口'],
      ['生理食鹽水','沖洗傷口與眼睛（眼睛連續沖 15 分鐘）'],
      ['蘆薈膠 Aloe','輕度曬傷，冷敷後薄擦；水泡不可弄破'],
      ['冰敷袋','每次 15 分鐘，中間隔一層毛巾，勿直接接觸皮膚'],
      ['口服補水','中暑或脫水：每 15 分鐘 120–240 ml 含電解質飲料'],
      ['⚠ 不可使用','催吐劑 Ipecac、活性碳（未經毒物中心指示）、酒精或雙氧水沖洗傷口、他人處方藥']
    ];
  },
  how:['所有外用藥仍屬「給藥」行為，需依校規確認是否需家長同意','使用前確認過敏史，使用後記錄於就診紀錄'],
  repeat:'依包裝指示，學校時段內通常只處理一次。',
  after:['告知學生與家長後續照護方式','傷口惡化、紅腫熱痛或化膿 → 通知家長就醫'],
  bad:['用雙氧水或酒精直接沖洗開放傷口（延遲癒合）','把類固醇乳膏塗在疑似感染或破皮處','未經毒物中心指示自行催吐']
},

{ id:'nal', tab:'Naloxone', name:'Naloxone 鼻噴劑（Narcan）', sub:'疑似鴉片類藥物過量 — 部分學校列為常備', tone:'alert',
  when:[
    '意識不清無法叫醒、呼吸極慢或停止、嘴唇發紫、瞳孔極度縮小',
    '<strong>不確定原因的昏迷也可以給</strong> — 若非鴉片類中毒，naloxone 不會造成傷害',
    '先確認學校是否備有並已納入 standing orders'
  ],
  dose:function(kg){
    return [
      ['鼻噴劑 4 mg','單側鼻孔全量噴入一次，不需依體重調整'],
      ['重複給藥','每 2–3 分鐘可再給一劑，交替鼻孔，直到呼吸恢復或救護人員到達'],
      ['注射劑 0.4 mg/mL IM','若學校備的是注射劑，依醫囑與 standing order 執行']
    ];
  },
  how:['先撥 911，再給藥','讓學生仰臥、托下巴打開呼吸道，噴完後改側臥（recovery position）','無呼吸或僅有瀕死式喘息 → 立即開始 CPR，勿只等 naloxone 生效'],
  repeat:'每 2–3 分鐘一劑，交替鼻孔，持續到有反應或 EMS 接手。',
  after:['作用時間比多數鴉片類短 → 可能再度昏迷，<strong>一律送醫並全程陪同</strong>','記錄給藥時間與劑數，交給救護人員','通知行政主管與家長，依校規處理'],
  bad:['給藥後就認為安全而取消救護車','讓學生獨處','等家長同意才給藥']
}
];

function doseRows(m, kg){
  return m.dose(kg).map(r=>`<tr>
    <td style="padding:11px 10px;border-bottom:1px solid var(--line);font-weight:600;width:34%;vertical-align:top;font-size:16px">${r[0]}</td>
    <td style="padding:11px 10px;border-bottom:1px solid var(--line);font-size:17px;${kg?'font-weight:600':''}">${r[1]}</td></tr>`).join('');
}
function wtEchoText(kg){
  return kg ? ('＝ '+kg+' kg ／ '+Math.round(kg/0.45359237)+' lb') : '未輸入體重時顯示標準體重區間';
}
/* 只更新劑量表，不重繪整頁，避免輸入時鍵盤焦點跳掉 */
function updateDose(){
  const kg = S.wt || 0;
  const m = MEDS.find(x=>x.id===(S.med||'epi')) || MEDS[0];
  const b = document.getElementById('doseBody'); if(b) b.innerHTML = doseRows(m, kg);
  const h = document.getElementById('doseHdr'); if(h) h.textContent = kg ? '（已依 '+kg+' kg 換算）' : '';
  const e = document.getElementById('wtEcho');  if(e) e.textContent = wtEchoText(kg);
}

function drawMeds(){
  const kg = S.wt || 0;
  const m = MEDS.find(x=>x.id===(S.med||'epi')) || MEDS[0];
  const tone = m.tone==='alert' ? 'var(--alert)' : m.tone==='amber' ? 'var(--amber)' : 'var(--teal)';
  const bg   = m.tone==='alert' ? 'var(--alert-dim)' : m.tone==='amber' ? 'var(--amber-dim)' : 'var(--teal-dim)';
  app.innerHTML = `
    <h1 class="ask">Emergency medications</h1>
    <p class="ask-zh">校園急救藥物劑量快速對照 — 輸入體重可自動換算。</p>

    <div class="card noprint" style="padding:14px 16px;margin-bottom:14px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label style="font-size:15px;color:var(--ink-2);font-weight:600">學生體重</label>
        <input id="wKg" inputmode="decimal" placeholder="kg" value="${kg?kg:''}" style="width:110px;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FBFDFC"
          oninput="S.wt=parseFloat(this.value)||0;document.getElementById('wLb').value='';updateDose()">
        <span style="color:var(--ink-2)">或</span>
        <input id="wLb" inputmode="decimal" placeholder="lb 磅" style="width:110px;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FBFDFC"
          oninput="S.wt=Math.round(lb2kg(parseFloat(this.value)||0)*10)/10;document.getElementById('wKg').value=S.wt||'';updateDose()">
        <span id="wtEcho" style="font-size:16px;font-weight:600">${wtEchoText(kg)}</span>
        <span class="spacer"></span>
        <button class="small" onclick="S.wt=0;drawMeds()">清除</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${MEDS.map(x=>`<button class="btn" style="padding:11px 16px;font-size:16px;${x.id===m.id?'background:var(--ink);border-color:var(--ink);color:#fff':''}"
        onclick="S.med='${x.id}';drawMeds()">${esc(x.tab)}</button>`).join('')}
    </div>

    <div class="card" style="border-color:${tone};border-width:2px">
      <div style="background:${bg};margin:-20px -20px 18px;padding:16px 20px;border-radius:10px 10px 0 0">
        <div style="font-size:24px;font-weight:700;color:${tone};letter-spacing:-.01em">${esc(m.name)}</div>
        <div style="font-size:16px;color:var(--ink-2);margin-top:4px">${esc(m.sub)}</div>
      </div>

      <h3>什麼時候給 INDICATIONS</h3>
      <ul style="margin:0 0 18px;padding-left:20px">${m.when.map(x=>`<li style="font-size:17px;margin-bottom:8px;line-height:1.55">${x}</li>`).join('')}</ul>

      <h3>劑量 DOSE<span id="doseHdr">${kg?'（已依 '+kg+' kg 換算）':''}</span></h3>
      <table style="width:100%;border-collapse:collapse;margin-bottom:18px">
        <tbody id="doseBody">${doseRows(m,kg)}</tbody>
      </table>

      <h3>怎麼給 ADMINISTRATION</h3>
      <ol class="steps" style="margin-bottom:18px">${m.how.map(x=>`<li>${x}</li>`).join('')}</ol>

      <div class="dispo" style="margin-bottom:18px"><b>可否重複：</b>${m.repeat}</div>

      <h3>給藥之後一定要做 AFTER</h3>
      <ol class="steps" style="margin-bottom:18px">${m.after.map(x=>`<li>${x}</li>`).join('')}</ol>

      <div class="flagbox" style="margin:0">
        <h4>常見錯誤 DO NOT</h4>
        <ul>${m.bad.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="card" style="background:#FBFDFC">
      <h3>給藥前後的共同原則</h3>
      <ol class="steps">
        <li><strong>先查文件：</strong>該生的 action plan、medication authorization form、家長同意書與過敏史；緊急狀況依 standing orders 執行，不需等家長同意。</li>
        <li><strong>五對：</strong>對人、對藥、對劑量、對時間、對途徑；核對藥品姓名標籤與有效期限。</li>
        <li><strong>記錄：</strong>給藥時間、劑量、部位、給藥前後的生命徵象與反應，簽名於 MAR 與就診紀錄。</li>
        <li><strong>中毒諮詢：</strong>美國 Poison Control <strong>1-800-222-1222</strong>（24 小時，可指示是否催吐或送醫）。</li>
        <li><strong>本頁僅為快速對照</strong>，實際劑量以該校醫囑、standing orders 與藥品說明書為準；上任第一天請先索取校方急救藥物清單與存放位置。</li>
      </ol>
    </div>

    <div class="nav noprint">
      <button class="btn go" onclick="go('home')">← 回主畫面</button>
      <button class="btn" onclick="go('sos')">🚨 緊急流程</button>
      <button class="btn" onclick="window.print()">列印這一頁</button>
    </div>`;
  const f = document.getElementById('wKg');
  if(f && kg){ f.value = kg; }
}

draw();
</script>
</body>
</html>
