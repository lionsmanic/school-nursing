<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health Office">
<meta name="theme-color" content="#0E7C7B">
<title>Health Office — K‑12 Student Check‑in 校護站</title>
<style>
:root{
  --ink:#11303B; --ink2:#4C6C77; --ink3:#8AA3A5;
  --paper:#EDF3F1; --paper2:#E2EBE8; --surface:#FFFFFF;
  --line:#D2E0DC; --line2:#E8F0ED;
  --teal:#0E7C7B; --teal-d:#0A5E5D; --teal-l:#DBEDEC;
  --amber:#A8690F; --amber-l:#FBF1DC;
  --alert:#AE2F24; --alert-l:#FBE5E2;
  --plum:#6B4A7A; --plum-l:#F1E9F4;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;padding:0;height:100%}
body{
  background:linear-gradient(180deg,#F4F8F6 0%,var(--paper) 40%,var(--paper2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
  font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ============ top bar ============ */
.bar{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;padding-top:max(9px,env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .mark{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,var(--teal),#12A09B);
  color:#fff;display:grid;place-items:center;font-size:19px;
  box-shadow:0 2px 6px rgba(14,124,123,.3);
}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-size:11.5px;color:var(--ink2);font-weight:500}
.who{flex:1;display:flex;gap:8px;min-width:0}
.who input{
  flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 12px;
  border:1px solid var(--line);border-radius:10px;background:#F8FBFA;color:var(--ink);
}
.who input::placeholder{color:#A2B6B4}
.tb{border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:600;white-space:nowrap}
.tb.on{background:var(--teal-l);border-color:#9FCFCD;color:var(--teal-d)}
.tb.alarm{background:var(--alert);border-color:var(--alert);color:#fff;letter-spacing:.02em}
.agepill{border:1px solid var(--line);background:#F8FBFA;padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink2)}

.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 0}

/* ============ headings ============ */
.h1{margin:6px 0 4px;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.h1.kid{font-size:42px}
.sub{margin:0 0 20px;font-size:18px;color:var(--ink2)}
.hint{font-size:14.5px;color:var(--ink2)}
.sec{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em;margin:0 0 12px}

/* ============ tiles ============ */
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.grid.k{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.tile{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--r);
  padding:16px;min-height:92px;
  box-shadow:0 1px 2px rgba(17,48,59,.05),0 6px 14px -10px rgba(17,48,59,.22);
  transition:transform .1s ease,border-color .12s,box-shadow .12s;
}
.tile:active{transform:scale(.98);border-color:var(--teal)}
.grid.k .tile{min-height:116px;padding:20px}
.disc{
  width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:27px;
}
.grid.k .disc{width:64px;height:64px;font-size:34px;border-radius:19px}
.tile .tx{min-width:0;flex:1}
.tile .en{display:block;font-size:20px;font-weight:650;letter-spacing:-.012em;line-height:1.25}
.grid.k .tile .en{font-size:24px}
.tile .zh{display:block;font-size:14.5px;color:var(--ink2);margin-top:3px}
.grid.k .tile .zh{font-size:16px}

/* option buttons */
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line2);border-radius:14px;
  padding:17px 16px;min-height:80px;
  box-shadow:0 1px 2px rgba(17,48,59,.05);
  transition:transform .1s ease,border-color .12s,background .12s;
}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--teal);border-width:2.5px;background:var(--teal-l);padding:16px 15px}
.opt .en{display:block;font-size:21px;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.opt .zh{display:block;font-size:14.5px;color:var(--ink2);margin-top:3px}
.opt .face{font-size:34px;flex:none}
.opt .tick{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:16px;opacity:0;flex:none}
.opt.on .tick{opacity:1}
.spk{
  margin-left:auto;flex:none;width:46px;height:46px;border-radius:50%;
  background:#F1F6F5;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;
}
.spk:active{background:var(--teal-l)}

/* ============ trail ============ */
.trail{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.chip{background:var(--teal-l);border:1px solid #B6D8D6;color:var(--teal-d);padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600}
.chip b{font-weight:500;opacity:.7;margin-left:6px}
.bars{display:flex;gap:5px;margin:0 0 14px}
.bars i{height:5px;border-radius:3px;background:#D5E4E1;flex:1}
.bars i.done{background:var(--teal)}

/* ============ nav ============ */
.nav{display:flex;gap:12px;margin:24px 0 8px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:15px 22px;border-radius:12px;font-size:17px;font-weight:600}
.btn.go{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 4px 12px -4px rgba(14,124,123,.5)}
.btn.go:disabled{opacity:.3;box-shadow:none}
.btn.warn{background:var(--alert);border-color:var(--alert);color:#fff}
.sp{flex:1}

/* ============ cards ============ */
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(17,48,59,.05),0 8px 20px -16px rgba(17,48,59,.3)}
.card+.card{margin-top:14px}
.card h3{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em}
.sum{font-size:23px;line-height:1.5;font-weight:650;letter-spacing:-.015em}
.sum .q{display:block;font-size:16px;font-weight:500;color:var(--ink2);margin-top:9px;line-height:1.6}
ol.steps{margin:0;padding-left:21px}
ol.steps li{margin-bottom:11px;font-size:17px;line-height:1.6}
ol.steps li:last-child{margin-bottom:0}
ol.steps li.add{background:var(--teal-l);border-radius:8px;padding:8px 10px;margin-left:-6px;font-weight:600}
.flag{background:var(--alert-l);border:1px solid #EEC4BE;border-left:5px solid var(--alert);border-radius:12px;padding:15px 17px}
.flag h4{margin:0 0 9px;color:var(--alert);font-size:17px}
.flag ul{margin:0;padding-left:19px}
.flag li{margin-bottom:7px;font-size:16.5px;line-height:1.5}
.dispo{background:var(--amber-l);border:1px solid #EDD9AE;border-radius:12px;padding:14px 16px;font-size:16.5px;margin-top:15px;line-height:1.6}
.dispo b{color:var(--amber)}
.say{background:#F6FBFA;border:1.5px dashed #B7D7D4;border-radius:13px;padding:14px 16px;margin-bottom:11px;display:flex;align-items:center;gap:12px}
.say .t{flex:1;min-width:0}
.say .e{font-size:22px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.say .c{font-size:15px;color:var(--ink2);margin-top:5px}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.vitals label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.vitals input,.card textarea,.card select{width:100%;font:inherit;font-size:16.5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#F8FBFA;color:var(--ink)}
.card textarea{min-height:78px;resize:vertical}
.stack{display:flex;flex-direction:column;gap:10px}
.timer{display:flex;align-items:center;gap:11px;margin-top:13px;flex-wrap:wrap}
.clock{font-size:31px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;letter-spacing:-.02em}
.sm{border:1px solid var(--line);background:#F8FBFA;padding:9px 14px;border-radius:9px;font-size:14.5px;font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);padding:11px 17px;border-radius:11px;font-size:16px;font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============ log ============ */
table.log{width:100%;border-collapse:collapse;font-size:14.5px}
table.log th{text-align:left;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--line);padding:9px 8px;letter-spacing:.03em}
table.log td{border-bottom:1px solid var(--line2);padding:11px 8px;vertical-align:top}
.empty{padding:48px 12px;text-align:center;color:var(--ink2)}

/* ============ emergency ============ */
.sos{background:linear-gradient(180deg,#FDEEEC,var(--alert-l));border:2.5px solid var(--alert);border-radius:18px;padding:24px}
.sos h2{margin:0 0 8px;color:var(--alert);font-size:29px;letter-spacing:-.02em}
.sos ol li{font-size:17.5px;margin-bottom:11px;line-height:1.55}

/* ============ printable pass ============ */
#passArea{display:none}
.pass{border:2px solid #333;border-radius:10px;padding:16px 20px;width:100%;max-width:520px;margin-bottom:14px}
.pass h4{margin:0 0 4px;font-size:20px}
.pass .row{display:flex;gap:10px;font-size:15px;padding:5px 0;border-bottom:1px dotted #bbb}
.pass .row span:first-child{width:110px;color:#555;flex:none}

@media print{
  .bar,.nav,.noprint,.tabs{display:none!important}
  body{background:#fff;font-size:11.5pt;padding:0}
  .wrap{padding:0;max-width:100%}
  .card{border:1px solid #999;box-shadow:none;break-inside:avoid;border-radius:6px}
  .cols{grid-template-columns:1fr}
  #passArea{display:block!important}
  #passArea.only ~ *{display:none}
}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    <span class="mark">✚</span>
    <span><b>Health Office</b><small>保健室 · 學生自助板</small></span>
  </div>
  <div class="who noprint">
    <input id="sName" placeholder="Student name 姓名" autocomplete="off">
    <input id="sGrade" placeholder="Grade 年級" autocomplete="off" style="max-width:120px">
  </div>
  <button class="agepill noprint" id="ageBtn" onclick="go('age')">年齡層</button>
  <button class="tb noprint on" id="ttsBtn" onclick="toggleTTS()">🔊 朗讀</button>
  <button class="tb noprint" onclick="go('phrases')">英文速查</button>
  <button class="tb noprint" onclick="go('log')">紀錄</button>
  <button class="tb alarm noprint" onclick="go('sos')">EMERGENCY</button>
</div>

<div class="wrap" id="app"></div>
<div id="passArea"></div>

<script>
/* =======================================================================
   語音（iOS Safari：首次必須在使用者手勢中觸發，否則靜音）
   ======================================================================= */
const TTS = {on:true, unlocked:false, voices:[]};
function loadVoices(){ try{ TTS.voices = speechSynthesis.getVoices()||[]; }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function unlockTTS(){
  if(TTS.unlocked || !('speechSynthesis' in window)) return;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); TTS.unlocked = true; loadVoices(); }catch(e){}
}
document.addEventListener('touchstart', unlockTTS, {once:true});
document.addEventListener('mousedown', unlockTTS, {once:true});

function pickVoice(lang){
  const v = TTS.voices.filter(x=>x.lang && x.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
  if(!v.length) return null;
  return v.find(x=>x.lang.replace('_','-').toLowerCase()===lang.toLowerCase())
      || v.find(x=>/samantha|karen|moira|aaron|mei-jia|meijia|siri/i.test(x.name)) || v[0];
}
function speak(text, lang, rate){
  if(!('speechSynthesis' in window) || !text) return;
  unlockTTS();
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[（(].*?[)）]/g,''));
    u.lang = lang || 'en-US';
    u.rate = rate || (S.age==='k2' ? .78 : .88);
    const v = pickVoice(u.lang); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function say(text, lang, rate){ speak(text, lang, rate); }          // 手動按 🔊
function autoSay(text){ if(TTS.on) setTimeout(()=>speak(text,'en-US'), 260); }  // 自動朗讀題目
function toggleTTS(){
  TTS.on = !TTS.on; unlockTTS();
  const b = document.getElementById('ttsBtn');
  b.classList.toggle('on', TTS.on); b.textContent = TTS.on ? '🔊 朗讀' : '🔇 靜音';
  if(!TTS.on){ try{speechSynthesis.cancel()}catch(e){} }
}

/* =======================================================================
   年齡層
   ======================================================================= */
const AGES = [
  {id:'k2',  en:'Kindergarten – Grade 2', zh:'幼稚園～小二', ico:'🧸', note:'字少、圖大、表情量表、自動朗讀'},
  {id:'g35', en:'Grade 3 – 5',            zh:'小三～小五',   ico:'🎒', note:'表情量表，題目稍完整'},
  {id:'g68', en:'Grade 6 – 8',            zh:'六年級～國中', ico:'🏀', note:'0–10 疼痛分數，加入月經、情緒'},
  {id:'g912',en:'Grade 9 – 12',           zh:'高中',         zh2:'', ico:'🎓', note:'完整選項，含私下談話與物質相關'}
];
const ALL = ['k2','g35','g68','g912'];
const okAge = o => !o.ages || o.ages.includes(S.age);

/* =======================================================================
   共用題組
   ======================================================================= */
const DUR_K = {ages:['k2','g35'], en:'When did it start?', zh:'什麼時候開始的？', o:[
  {en:'Just now', zh:'剛剛', ico:'⏱'},
  {en:'This morning', zh:'今天早上', ico:'🌤'},
  {en:'Yesterday', zh:'昨天', ico:'🌙'},
  {en:'A long time', zh:'很久了', ico:'📅'}
]};
const DUR_T = {ages:['g68','g912'], en:'How long has it been going on?', zh:'持續多久了？', o:[
  {en:'Just started', zh:'剛開始'},
  {en:'Earlier today', zh:'今天稍早'},
  {en:'Since yesterday', zh:'昨天開始'},
  {en:'Several days', zh:'好幾天了'}
]};
const PAIN_K = {ages:['k2','g35'], en:'How much does it hurt?', zh:'有多痛？', o:[
  {en:'A little bit', zh:'一點點', ico:'🙂'},
  {en:'Some', zh:'有點痛', ico:'😕'},
  {en:'A lot', zh:'很痛', ico:'😣', flag:'學生表達「很痛」— 需實際評估並考慮通知家長'},
  {en:'The worst', zh:'超級痛', ico:'😭', flag:'學生表達最高級疼痛 — 立即評估生命徵象並通知家長'}
]};
const PAIN_T = {ages:['g68','g912'], en:'Rate your pain from 1 to 10', zh:'疼痛分數 1–10', o:[
  {en:'1 – 3  mild', zh:'輕微'},
  {en:'4 – 6  moderate', zh:'中等'},
  {en:'7 – 10  severe', zh:'嚴重', flag:'疼痛 7 分以上 — 需完整評估並通知家長'}
]};
const DUR = [DUR_K, DUR_T], PAIN = [PAIN_K, PAIN_T];

/* =======================================================================
   主資料
   cat  { id, en, zh, ico, tint, ages?, q[], plan[], dispo, say[] }
   q    { en, zh, multi?, ages?, o[] }
   o    { en, zh, ico?, ages?, flag?, act?[] }
   ======================================================================= */
const DATA = [

{ id:'head', en:'Headache or dizzy', zh:'頭痛、頭暈', ico:'🤕', tint:'#FDE8E4',
  q:[
    {en:'What do you feel?', zh:'是哪一種？', o:[
      {en:'My head hurts', zh:'頭痛', ico:'🤕'},
      {en:'I feel dizzy', zh:'頭暈、站不穩', ico:'💫'},
      {en:'Both', zh:'兩種都有', ico:'😖'}
    ]},
    ...DUR, ...PAIN,
    {en:'Anything else? Tap all', zh:'還有什麼？可複選', multi:true, o:[
      {en:'I hit my head', zh:'有撞到頭', ico:'💥', flag:'頭部外傷 — 啟動 head injury / concussion protocol，務必通知家長',
        act:['執行 neuro check：意識、瞳孔、平衡、記憶與定向感，每 15 分鐘一次，至少 1 小時',
             '詢問是否失去意識、是否記得受傷經過；有嘔吐、嗜睡、複視、抽搐 → 立即 911',
             '填寫 head injury report，通知家長並提供 concussion fact sheet（返家後 24–48 小時觀察）',
             '當日不得再參加體育課或運動（return-to-play 須醫師評估）']},
      {en:'I want to throw up', zh:'想吐', ico:'🤢', flag:'頭痛合併噁心嘔吐 — 需排除頭部外傷、感染與腦壓問題'},
      {en:'I feel hot', zh:'覺得發燒', ico:'🌡', act:['量體溫並記錄']},
      {en:'I cannot see well', zh:'視線模糊', ico:'👁', flag:'視力改變 — 通知家長就醫，學生不可自行離校'},
      {en:'I did not eat breakfast', zh:'沒吃早餐', ico:'🥣', act:['低血糖可能：給予餅乾或果汁，15 分鐘後重新評估']},
      {en:'I did not sleep well', zh:'沒睡好', ico:'😴'},
      {en:'I was on a screen a long time', zh:'一直看螢幕', ico:'💻', ages:['g35','g68','g912']},
      {en:'Nothing else', zh:'沒有了', ico:'✋'}
    ]}
  ],
  plan:['測量體溫、脈搏、血壓並記錄','詢問今日進食、飲水、睡眠、用眼與壓力情形','安置於安靜微暗處休息 15–20 分鐘，給予溫開水','15–20 分鐘後重新評估疼痛與活動力，可返班者註記返班時間'],
  dispo:'單純頭痛休息後緩解 → 返班。合併撞到頭、嘔吐、視力改變、發燒或疼痛未緩解 → 通知家長帶回就醫。',
  say:[{en:'Sit here and rest for fifteen minutes. I will check on you.', zh:'坐在這裡休息十五分鐘，我會再來看你。'},
       {en:'Please drink some water.', zh:'喝一點水。'},
       {en:'Did you hit your head today?', zh:'今天有撞到頭嗎？'}]
},

{ id:'tummy', en:'Stomach ache', zh:'肚子痛、想吐', ico:'🤢', tint:'#FBEEDC',
  q:[
    {en:'What is happening?', zh:'是哪一種？可複選', multi:true, o:[
      {en:'My tummy hurts', zh:'肚子痛', ico:'😣'},
      {en:'I feel like throwing up', zh:'想吐', ico:'🤢'},
      {en:'I threw up', zh:'已經吐了', ico:'🤮', flag:'已嘔吐 — 依校規通常需通知家長帶回，並符合返校規定（多為症狀停止 24 小時）'},

let S = {view:'age', age:'g35', cat:null, step:0, picks:[], sel:[], timer:null, tLeft:0, call:'pick'};
const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q2 = s => String(s==null?'':s).replace(/'/g,"\\'").replace(/"/g,'&quot;');

function go(v){ S.view=v; draw(); scrollTo(0,0); }
function setAge(id){
  S.age = id;
  const a = AGES.find(x=>x.id===id);
  document.getElementById('ageBtn').textContent = a.ico + ' ' + a.zh;
  go('home');
}
function cats(){ return DATA.filter(okAge); }
function qs(){ return S.cat.q.filter(okAge); }
function qText(q){ return q.en; }

function startCat(id){
  S.cat = DATA.find(c=>c.id===id); S.step=0; S.picks=[]; S.sel=[];
  S.view='q'; draw(); scrollTo(0,0);
  autoSay(qText(qs()[0]));
}
function toggle(i){
  const q = qs()[S.step], o = q.o.filter(okAge)[i];
  if(TTS.on) say(o.en,'en-US');
  if(q.multi){
    const k = S.sel.indexOf(i); if(k>=0) S.sel.splice(k,1); else S.sel.push(i);
    draw();
  } else { S.sel=[i]; setTimeout(next, TTS.on?450:0); }
}
function next(){
  const q = qs()[S.step];
  S.picks[S.step] = {q, o:q.o.filter(okAge), sel:S.sel.slice()};
  S.sel = [];
  if(S.step < qs().length-1){ S.step++; S.view='q'; draw(); scrollTo(0,0); autoSay(qText(qs()[S.step])); }
  else { S.view='result'; try{speechSynthesis.cancel()}catch(e){} draw(); scrollTo(0,0); }
}
function back(){
  if(S.step>0){ S.step--; S.sel=(S.picks[S.step]||{sel:[]}).sel.slice(); S.view='q'; }
  else { S.view='home'; S.cat=null; }
  draw(); scrollTo(0,0);
}

function draw(){
  const f = {age:drawAge, home:drawHome, q:drawQ, result:drawResult, call:drawCall,
             pass:drawPass, log:drawLog, phrases:drawPhrases, sos:drawSOS}[S.view];
  (f||drawHome)();
}

function drawQ(){
  const list = qs(), q = list[S.step], opts = q.o.filter(okAge), kid = S.age==='k2';
  const trail = [];
  S.picks.forEach(p=>{ if(p) p.sel.forEach(i=>trail.push(`<span class="chip">${esc(p.o[i].en)}<b>${esc(p.o[i].zh)}</b></span>`)); });
  app.innerHTML = `
    <div class="bars">${list.map((_,i)=>`<i class="${i<=S.step?'done':''}"></i>`).join('')}</div>
    ${trail.length?`<div class="trail">${trail.join('')}</div>`:''}
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1">
        <h1 class="h1 ${kid?'kid':''}">${esc(qText(q))}</h1>

      </div>
      <button class="spk" style="margin-top:10px" onclick="say('${q2(qText(q))}','en-US')">🔊</button>
    </div>
    <div class="grid ${kid?'k':'w'}">
      ${opts.map((o,i)=>`
        <button class="opt ${S.sel.includes(i)?'on':''}" onclick="toggle(${i})">
          ${o.ico?`<span class="face">${o.ico}</span>`:''}
          <span class="tx"><span class="en">${esc(o.en)}</span><span class="zh">${esc(o.zh)}</span></span>
          <span class="tick">✓</span>

    </div>
    <div class="nav">
      <button class="btn" onclick="back()">← Back 上一步</button>
      <span class="sp"></span>
      <span class="hint">${S.step+1} / ${list.length}</span>
      ${q.multi?`<button class="btn go" onclick="next()" ${S.sel.length?'':'disabled'}>Next 下一步 →</button>`:''}
    </div>`;
}

function digest(){
  const zh=[], en=[], flags=[], acts=[];
  S.picks.forEach(p=>{ if(!p) return;
    const zs=p.sel.map(i=>p.o[i].zh), es=p.sel.map(i=>p.o[i].en);
    if(zs.length) zh.push(p.q.zh.replace(/[？?].*$/,'')+'：'+zs.join('、'));
    if(es.length) en.push(es.join(', '));
    p.sel.forEach(i=>{ const o=p.o[i]; if(o.flag) flags.push(o.flag); if(o.act) o.act.forEach(a=>acts.push(a)); });
  });
  return {zh,en,flags,acts};
}

/* ---------- 家長電話腳本 ---------- */
function fill(t){
  const d = digest();
  return t.replace(/\[NAME\]/g, NAME())
          .replace(/\[TIME\]/g, new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}))
          .replace(/\[COMPLAINT\]/g, S.cat ? (S.cat.en.toLowerCase()+(d.en[0]?' — '+d.en[0].toLowerCase():'')) : 'a health problem')
          .replace(/\[TEMP\]/g, V('vTemp')||'normal');
}
function fillZh(t){
  const d = digest();
  return t.replace(/\[NAME\]/g, V('sName')||'學生')
          .replace(/\[TIME\]/g, new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}))
          .replace(/\[COMPLAINT\]/g, S.cat?S.cat.zh:'身體不適')
          .replace(/\[TEMP\]/g, V('vTemp')||'正常');
}
function setCall(k){ S.call=k; drawCall(); }

  app.innerHTML = `
    <h1 class="h1">Calling the parents</h1>
    <p class="sub">照著唸就好，每一句都可以按 🔊 先聽一次發音。空白處已自動帶入學生姓名與主訴。</p>
    <div class="tabs">
      ${Object.keys(CALLS).map(k=>`<button class="tab ${k===S.call?'on':''}" onclick="setCall('${k}')">${CALLS[k].label}</button>`).join('')}
    </div>
    <div class="cols">
      <div>
        <div class="card" style="background:${c.tint}">
          <h3>電話腳本　PHONE SCRIPT</h3>
          ${c.lines.map(l=>{const e=fill(l[0]);return `
            <div class="say" style="background:#fff"><div class="t">
              <div class="e">${esc(e)}</div><div class="c">${esc(fillZh(l[1]))}</div></div>
              <button class="spk noprint" onclick="say('${q2(e)}','en-US')">🔊</button></div>`;}).join('')}
          <button class="btn noprint" style="margin-top:6px" onclick="sayAll()">▶︎ 整段連續朗讀</button>
        </div>
      </div>
      <div>
        <div class="card">
          <h3>家長可能會這樣回　IF THEY SAY…</h3>
          ${REPLIES.map(r=>`<div style="padding:12px 0;border-bottom:1px solid var(--line2)">
            <div style="font-size:17px;font-weight:600">${esc(r[0])}</div>
            <div class="hint">${esc(r[1])}</div>
            <div style="margin-top:7px;font-size:16px;color:var(--teal-d)">↳ ${esc(r[2].split('｜')[0])}</div>
            <div class="hint">${esc(r[2].split('｜')[1]||'')}</div>
          </div>`).join('')}
        </div>
        <div class="card noprint">
          <div class="stack">
            <button class="btn" onclick="window.print()">🖨 列印腳本</button>

}
function sayAll(){
  const c = CALLS[S.call];
  try{ speechSynthesis.cancel(); }catch(e){}
  unlockTTS();
  c.lines.forEach(l=>{
    const u = new SpeechSynthesisUtterance(fill(l[0]));
    u.lang='en-US'; u.rate=.85; const v=pickVoice('en-US'); if(v) u.voice=v;
    try{ speechSynthesis.speak(u); }catch(e){}
  });
}

function printPass(){
  const src = document.getElementById('passSrc');
  const area = document.getElementById('passArea');
  area.innerHTML = src.innerHTML; area.classList.add('only');
  const hide = document.querySelector('.wrap'); hide.style.display='none';
  window.print();
  setTimeout(()=>{ hide.style.display=''; area.innerHTML=''; area.classList.remove('only'); }, 600);
}

/* ---------- 計時器 ---------- */
function startTimer(min){
  stopTimer(); S.tLeft = min*60;
  const tick = ()=>{
    const e = document.getElementById('clock'); if(!e){ stopTimer(); return; }
    const m = Math.floor(S.tLeft/60), s = S.tLeft%60;
    e.textContent = m+':'+String(s).padStart(2,'0');
    if(S.tLeft<=0){ e.textContent='時間到 ✓'; e.style.color='var(--alert)'; say('Time is up. Please check the student.','en-US'); stopTimer(); return; }
    S.tLeft--;
  };
  tick(); S.timer=setInterval(tick,1000);
}
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }

/* ---------- 紀錄 ---------- */
function getRecs(){ try{ return JSON.parse(localStorage.getItem('ho_recs')||'[]'); }catch(e){ return window._recs||[]; } }
function putRecs(r){ window._recs=r; try{ localStorage.setItem('ho_recs', JSON.stringify(r)); }catch(e){} }
function saveRec(){
  const d = digest();
  const r = {t:new Date().toISOString(), name:V('sName'), grade:V('sGrade'), age:S.age,
    cat:S.cat.zh, catEn:S.cat.en, detail:d.zh.join('｜'), detailEn:d.en.join(' / '), flags:d.flags.join('；'),
    temp:V('vTemp'), hr:V('vHr'), bp:V('vBp'), spo:V('vSpo'), pain:V('vPain'), note:V('vNote')};
  const a = getRecs(); a.unshift(r); putRecs(a); go('log');
}
function delRec(i){ const a=getRecs(); a.splice(i,1); putRecs(a); drawLog(); }
function drawLog(){
  const recs = getRecs();
  app.innerHTML = `
    <h1 class="h1">Visit log</h1>
    <p class="sub">就診紀錄存在這台 iPad 的瀏覽器中，建議每天下班前匯出 CSV 交給學校後清除。</p>
    <div class="nav noprint" style="margin-top:0">
      <button class="btn go" onclick="go('home')">← 回主畫面</button>
      <button class="btn" onclick="exportCSV()">⬇︎ 匯出 CSV</button>
      <button class="btn" onclick="window.print()">🖨 列印</button>
      <span class="sp"></span>
      <button class="btn" onclick="if(confirm('確定清除全部紀錄？此動作無法復原。')){putRecs([]);drawLog()}">清除全部</button>
    </div>
    <div class="card">
      ${recs.length?`<table class="log">
        <tr><th>時間</th><th>學生</th><th>主訴</th><th>細節</th><th>紅旗</th><th>生命徵象</th><th>處置備註</th><th></th></tr>
        ${recs.map((r,i)=>`<tr>
          <td>${new Date(r.t).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
          <td>${esc(r.name||'—')}<br><span style="color:var(--ink3)">${esc(r.grade||'')}</span></td>
          <td>${esc(r.cat)}</td>
          <td style="max-width:240px">${esc(r.detail)}</td>
          <td style="color:var(--alert);max-width:200px">${esc(r.flags||'')}</td>
          <td>${[r.temp&&'T '+r.temp,r.hr&&'HR '+r.hr,r.bp&&'BP '+r.bp,r.spo&&'SpO₂ '+r.spo,r.pain&&'Pain '+r.pain].filter(Boolean).map(esc).join('<br>')||'—'}</td>
          <td style="max-width:240px">${esc(r.note||'')}</td>
          <td class="noprint"><button class="sm" onclick="delRec(${i})">刪</button></td>
        </tr>`).join('')}
      </table>`:`<div class="empty">還沒有紀錄。學生完成點選後按「儲存就診紀錄」即會出現在這裡。</div>`}
    </div>`;
}
function exportCSV(){
  const recs = getRecs();
  if(!recs.length){ alert('目前沒有紀錄可匯出。'); return; }
  const head = ['時間','姓名','年級','年齡層','主訴','主訴EN','細節','細節EN','紅旗','體溫','脈搏','血壓','血氧','疼痛','處置備註'];
  const rows = recs.map(r=>[new Date(r.t).toLocaleString('zh-TW'),r.name,r.grade,r.age,r.cat,r.catEn,r.detail,r.detailEn,r.flags,r.temp,r.hr,r.bp,r.spo,r.pain,r.note]);
  const csv = '\uFEFF'+[head,...rows].map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'health-office-log-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
